name: Daily ECOS Check

on:
  schedule:
    # 08:00 KST = 23:00 UTC (previous day). Adjust the hour below if
    # you want a different time -- keep in mind ECOS data itself is
    # published with roughly a 1-day lag, so running earlier won't
    # get you a fresher number.
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the GitHub UI, for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily check
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
